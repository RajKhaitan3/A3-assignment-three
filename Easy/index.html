<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Squid Game</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav>
      <div class="logo">
        <img src="images/logo.png" alt="" />
      </div>
      <div class="nav-items">
        <p>About</p>
        <p>Watch now</p>
        <p>Actors</p>
        <p>Contact</p>
      </div>
      <div class="ham">
        <i class="ri-menu-3-line"></i>
      </div>
    </nav>
    <section>
      <div class="left">
        <img src="images/section-logo.png" alt="" />
        <p>
          Action / Thriller / Drama Series directed by Dong-hyuk Hwang<br />Season
          1: 9 Episodes
        </p>
        <div class="buttons">
          <button>
            <i class="ri-play-circle-fill"></i>
            <p>Play Now</p>
          </button>
          <button>
            <i class="ri-play-line"></i>
            <p>Watch Trailer</p>
          </button>
        </div>
      </div>
      <div class="scrollbar">
        <div class="line"></div>
        <span>SCROLL</span>
      </div>
      <div class="bg-text">SQUID</div>
      <div class="bg-text-2">GAME</div>
      <div class="right">
        <img src="images/guard.png" alt="" />
        <div class="socials-icon">
          <i class="ri-twitter-line"></i>
          <i class="ri-instagram-line"></i>
          <i class="ri-facebook-line"></i>
        </div>
      </div>
    </section>

    <div class="bottom">
      <div class="movie-card">
        <div class="card">
          <img src="images/bottom-logo1.png" alt="" />
          <i class="ri-play-fill play-icon"></i>
        </div>
        <div class="card">
          <img src="images/bottom-logo2.png" alt="" />
          <i class="ri-play-fill play-icon"></i>
        </div>
        <div class="card">
          <img src="images/bottom-logo3.png" alt="" />
          <i class="ri-play-fill play-icon"></i>
        </div>
      </div>
    </div>
  </body>
</html>
